name: Release fellow-agents

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string

env:
  DOTNET_VERSION: '10.0.x'
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '22'
  # Forces JS-based actions targeting Node 20 to run on Node 24.
  # GitHub deprecates Node 20 on 2026-06-16 (forced switch) and removes it on 2026-09-16.
  # Transitional shim — when Node 20 is fully removed, bump action majors instead.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # Build emcom + tracker (.NET) and emcom-server (PyInstaller) per platform
  build-binaries:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            suffix: .exe
            platform: win-x64
            # Windows PyInstaller bootloader expands %VAR% via ExpandEnvironmentStringsW.
            # Colocates bootloader extraction with app state — avoids AppLocker %TEMP% issues.
            runtime_tmpdir: '%USERPROFILE%\.emcom\runtime'
          - os: macos-latest
            rid: osx-arm64
            suffix: ''
            platform: osx-arm64
            # POSIX PyInstaller bootloader does NO expansion (~ or $VAR) — empty string omits
            # the flag; default tempfile.gettempdir() (/tmp/_MEI<random>) is fine. No AppLocker concern.
            runtime_tmpdir: ''
          - os: ubuntu-22.04    # glibc 2.35 — works on bookworm+ and Ubuntu 22.04+
            rid: linux-x64
            suffix: ''
            platform: linux-x64
            runtime_tmpdir: ''
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout banana (source)
        uses: actions/checkout@v4
        with:
          repository: rajan-chari/banana

      - name: Capture banana SHA + version vars
        id: vars
        shell: bash
        run: |
          SHA=$(git rev-parse HEAD)
          # inputs.version is e.g. "v0.0.22"; strip leading v for .NET assembly Version
          RAW="${{ inputs.version }}"
          NUMERIC="${RAW#v}"
          BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "release_tag=$RAW" >> $GITHUB_OUTPUT
          echo "assembly_version=$NUMERIC" >> $GITHUB_OUTPUT
          echo "built_at=$BUILT_AT" >> $GITHUB_OUTPUT
          echo "Banana SHA: $SHA"
          echo "Release tag: $RAW"
          echo "Assembly version (numeric): $NUMERIC"
          echo "Built at: $BUILT_AT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build emcom CLI
        env:
          BANANA_SHA: ${{ steps.vars.outputs.sha }}
          RELEASE_TAG: ${{ steps.vars.outputs.release_tag }}
          BUILT_AT: ${{ steps.vars.outputs.built_at }}
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: dotnet publish emcom/emcomcs/emcomcs.csproj -c Release -r ${{ matrix.rid }} --self-contained -o out/emcom -p:Version=${{ steps.vars.outputs.assembly_version }} -p:InformationalVersion="${{ steps.vars.outputs.release_tag }}+banana.${{ steps.vars.outputs.sha }}.${{ matrix.platform }}"

      - name: Build tracker CLI
        env:
          BANANA_SHA: ${{ steps.vars.outputs.sha }}
          RELEASE_TAG: ${{ steps.vars.outputs.release_tag }}
          BUILT_AT: ${{ steps.vars.outputs.built_at }}
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: dotnet publish emcom/trackercs/trackercs.csproj -c Release -r ${{ matrix.rid }} --self-contained -o out/tracker -p:Version=${{ steps.vars.outputs.assembly_version }} -p:InformationalVersion="${{ steps.vars.outputs.release_tag }}+banana.${{ steps.vars.outputs.sha }}.${{ matrix.platform }}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Write build provenance (emcom/emcom/_version.py)
        shell: bash
        run: |
          cat > emcom/emcom/_version.py <<EOF
          # Auto-generated by fellow-agents release.yml — do not edit.
          __banana_sha__ = "${{ steps.vars.outputs.sha }}"
          __release_tag__ = "${{ steps.vars.outputs.release_tag }}"
          __built_at__ = "${{ steps.vars.outputs.built_at }}"
          __platform__ = "${{ matrix.platform }}"
          EOF
          echo "--- emcom/emcom/_version.py ---"
          cat emcom/emcom/_version.py

      - name: Build emcom-server
        shell: bash
        run: |
          pip install pyinstaller
          pip install "emcom/"
          if [ -n "${{ matrix.runtime_tmpdir }}" ]; then
            pyinstaller --onefile --name "emcom-server${{ matrix.suffix }}" --runtime-tmpdir "${{ matrix.runtime_tmpdir }}" emcom/emcom_server/main.py
          else
            pyinstaller --onefile --name "emcom-server${{ matrix.suffix }}" emcom/emcom_server/main.py
          fi

      - name: Assemble bin directory
        shell: bash
        run: |
          mkdir -p pkg/bin/${{ matrix.platform }}
          cp "out/emcom/emcom${{ matrix.suffix }}" "pkg/bin/${{ matrix.platform }}/"
          cp "out/tracker/tracker${{ matrix.suffix }}" "pkg/bin/${{ matrix.platform }}/"
          cp "dist/emcom-server${{ matrix.suffix }}" "pkg/bin/${{ matrix.platform }}/"
          # Ensure Unix binaries are executable
          if [ "${{ matrix.suffix }}" = "" ]; then
            chmod +x pkg/bin/${{ matrix.platform }}/*
          fi

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.platform }}
          path: pkg/bin/${{ matrix.platform }}

  # Build pty-win from TypeScript source and package for distribution
  build-pty-win:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout banana (source)
        uses: actions/checkout@v4
        with:
          repository: rajan-chari/banana

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install and build
        working-directory: pty-win
        run: |
          npm install
          npm run build

      - name: Package pty-win
        run: |
          mkdir -p pkg/pty-win
          cp -r pty-win/dist pkg/pty-win/
          cp -r pty-win/public pkg/pty-win/
          cp pty-win/package.json pkg/pty-win/
          cp pty-win/package-lock.json pkg/pty-win/

      - name: Upload pty-win
        uses: actions/upload-artifact@v4
        with:
          name: pty-win
          path: pkg/pty-win

  # Assemble all artifacts into release archives and publish
  release:
    needs: [build-binaries, build-pty-win]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create per-platform bin archives
        run: |
          for platform in win-x64 osx-arm64 linux-x64; do
            mkdir -p staging/bin/$platform
            cp artifacts/bin-$platform/* staging/bin/$platform/
            (cd staging && zip -r "../bin-$platform.zip" "bin/$platform/")
            rm -rf staging
          done

      - name: Create pty-win archive
        run: |
          mkdir -p staging/pty-win
          cp -r artifacts/pty-win/* staging/pty-win/
          (cd staging && zip -r ../pty-win.zip pty-win/)
          rm -rf staging

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: fellow-agents ${{ inputs.version }}
          body: |
            ## fellow-agents ${{ inputs.version }}

            One-click multi-agent system. Clone the repo and run `setup.ps1` (Windows) or `setup.sh` (Mac/Linux).

            ### What's included
            | Archive | Contents |
            |---------|----------|
            | `bin-win-x64.zip` | emcom, tracker, emcom-server (Windows x64) |
            | `bin-osx-arm64.zip` | emcom, tracker, emcom-server (macOS ARM) |
            | `bin-linux-x64.zip` | emcom, tracker, emcom-server (Linux x64) |
            | `pty-win.zip` | Terminal multiplexer (requires Node.js 18+) |

            ### Quick start
            ```bash
            npm install -g fellow-agents
            fellow-agents start
            ```

            Or clone directly:
            ```bash
            git clone https://github.com/rajan-chari/fellow-agents
            cd fellow-agents && ./setup.sh
            ```
          files: |
            bin-win-x64.zip
            bin-osx-arm64.zip
            bin-linux-x64.zip
            pty-win.zip
          draft: false
          prerelease: false

  # Publish to npm (disabled until NPM_TOKEN secret is configured)
